[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"

[workspace.dependencies]
# The UI framework is pinned exactly on purpose: an upgrade is its own
# deliberate landing (changelog skimmed), never a rider on a feature landing.
gpui = "=0.2.2"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
flate2 = "1"
globset = "0.4"
image = "0.25"
futures-core = "0.3"
nucleo = "0.5"
octocrab = "0.54"
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9"
