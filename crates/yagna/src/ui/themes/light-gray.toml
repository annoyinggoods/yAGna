text = "#2b2b2b"
text_muted = "#5c5c5c"
accent = "#3a6ea5"
border = "#d0d0d0"
health_good = "#2c6b38"
health_mid = "#7a5c12"
health_low = "#94302c"
language_bar = "#44637f"
scrim = "#000000"
notice_bg = "#e6edf6"
notice_text = "#232a33"
status_info = "#465468"
status_error = "#8f3030"
tab_active = "#e0e0e0"
tab_inactive = "#fbfbfb"
